# ===========================================
# DietAIbook Docker Compose for Dokploy
# ===========================================
#
# This compose file orchestrates:
# - PostgreSQL 16 database (self-hosted, for app data)
# - Next.js application (built with Bun, runs on Node.js)
#
# Authentication uses Supabase Auth (external, free tier)
# All app data stored in self-hosted PostgreSQL
#
# Required environment variables in Dokploy:
# - POSTGRES_PASSWORD (strong password)
# - DOMAIN (your domain, e.g., dietaibook.com)
# - NEXTAUTH_URL (https://your-domain.com)
# - NEXTAUTH_SECRET (openssl rand -base64 32)
# - NEXT_PUBLIC_SUPABASE_URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - EDAMAM_APP_ID
# - EDAMAM_APP_KEY
# - STRIPE_SECRET_KEY (sk_live_... in prod)
# - STRIPE_WEBHOOK_SECRET (whsec_... from the Stripe dashboard Webhooks page)
# - ANTHROPIC_API_KEY (in-app AI Chat Agent + Mastra workflows)
# - SUPADATA_API_KEY (recipe import)
# - FDC_API_KEY (FoodData Central nutrition lookups)
# - STORE_CREDENTIALS_ENCRYPTION_KEY (shopping automation credential encryption)
# ===========================================

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: dietaibook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dietaibook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dietaibook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dietaibook} -d ${POSTGRES_DB:-dietaibook}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dokploy-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_ vars must be passed at build time (embedded in JS bundle)
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: dietaibook-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database connection (auto-configured for internal network)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dietaibook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dietaibook}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-dietaibook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dietaibook}?schema=public

      # NextAuth Configuration
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

      # Supabase Auth (external service - authentication only)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}

      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

      # External APIs
      - EDAMAM_APP_ID=${EDAMAM_APP_ID}
      - EDAMAM_APP_KEY=${EDAMAM_APP_KEY}
      - BROWSER_USE_API_KEY=${BROWSER_USE_API_KEY:-}

      # Stripe (server-side runtime — read via process.env in src/lib/stripe.ts
      # and src/app/api/webhooks/stripe/route.ts). Must be declared HERE or the
      # container never receives them, even when set in the Dokploy Environment UI.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_TRIAL_DAYS=${STRIPE_TRIAL_DAYS:-14}

      # AI Chat Agent — ANTHROPIC_API_KEY is REQUIRED for the in-app chat (DIE-30)
      # and Mastra workflows; the app throws without it.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHAT_LLM_MODEL=${CHAT_LLM_MODEL:-}
      - CHAT_COST_CAP_ENFORCED=${CHAT_COST_CAP_ENFORCED:-}
      # Optional Vertex/Gemma path (fallback LLM + recipe image generation)
      - GEMMA_MODEL=${GEMMA_MODEL:-}
      - GOOGLE_VERTEX_LOCATION=${GOOGLE_VERTEX_LOCATION:-}

      # Recipe import (Supadata) + nutrition lookups (FoodData Central) — required
      - SUPADATA_API_KEY=${SUPADATA_API_KEY}
      - FDC_API_KEY=${FDC_API_KEY}

      # Store-credentials encryption for shopping automation — REQUIRED (throws if unset)
      - STORE_CREDENTIALS_ENCRYPTION_KEY=${STORE_CREDENTIALS_ENCRYPTION_KEY}

      # Entitlements / feature flags
      - ENTITLEMENTS_ENFORCED=${ENTITLEMENTS_ENFORCED:-}
      - FEATURE_MULTIMODAL_IMPORT=${FEATURE_MULTIMODAL_IMPORT:-}

      # Cron endpoint auth (src/app/api/cron/*)
      - CRON_SECRET=${CRON_SECRET:-}

      # Google Cloud Document AI (Optional — recipe OCR import)
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID:-}
      - DOCUMENT_AI_LOCATION=${DOCUMENT_AI_LOCATION:-}
      - DOCUMENT_AI_CUSTOM_PROCESSOR_ID=${DOCUMENT_AI_CUSTOM_PROCESSOR_ID:-}
      # Path to the service-account JSON, used as keyFilename by the Document AI
      # client (src/app/api/recipes/import/document/route.ts:51). The file itself
      # is NOT committed — provide it via a Dokploy File Mount at this exact path.
      - GOOGLE_CLOUD_SERVICE_ACCOUNT_PATH=${GOOGLE_CLOUD_SERVICE_ACCOUNT_PATH:-/app/secrets/gcp-service-account.json}
    ports:
      - "3000"
    networks:
      - dokploy-network
    # Note: Traefik routing is managed by Dokploy UI, not docker-compose labels
    # Configure domain in Dokploy: Project → Domains → Add "dietaimanager.com"

# Persistent volume for database
volumes:
  postgres_data:
    driver: local

# External network managed by Dokploy
networks:
  dokploy-network:
    external: true
